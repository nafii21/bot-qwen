symbol_data: "^NDX"

# ==== EQUITY & RISK ====
equity: 1000          # USD
risk_pct: 0.5         # % per trade

# ==== STRATEGI M15 ====
strategy:
  ema_fast: 20
  ema_slow: 50
  atr_period: 14
  adx_period: 14
  adx_min: 20
  rr_target: 1.5
  swing_lookback: 30      # candle untuk cari swing high/low
  max_dist_from_ema_atr: 1.5

# ==== FIBONACCI ====
fib:
  enabled: true
  golden_low: 0.5
  golden_high: 0.618

# ==== NEWS FILTER ====
news:
  enabled: true
  minutes_before: 30
  minutes_after: 30
